{# inventario/templates/inventario/agregar_producto.html #}
{% extends "index.html" %}
{% load crispy_forms_tags %}
{% load static %}


{% block content %}

<link rel="stylesheet" href="{% static 'css/estilo_productos.css' %}">

  <h1>Agregar Producto al Inventario</h1>
  <a href="{% url 'home' %}"><i class="bi bi-house-fill me-1"></i>Inicio</a>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Agregar Producto</button>
  </form>
{% endblock %}
