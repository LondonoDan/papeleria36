{% extends "index.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/estilosproductos.css' %}">

<div class="crud-container">

    <div class="crud-header">
        <h1><i class="bi bi-pencil-square me-2"></i>Editar Producto</h1>
        <a href="{% url 'inventario:lista_productos' %}" class="btn-volver">
            <i class="bi bi-arrow-left me-1"></i> Volver al listado
        </a>
    </div>

    <div class="crud-card">
        <div class="crud-card-header">
            Editando: <strong>{{ producto.nombre }}</strong>
        </div>
        <div class="crud-card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="crud-actions">
                    <a href="{% url 'inventario:lista_productos' %}" class="btn-cancelar">
                        <i class="bi bi-x-circle me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-check-circle me-1"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
