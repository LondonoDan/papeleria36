{% extends "index.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/eliminar_usuario.css' %}">
<h1><i class="bi bi-trash3 me-2"></i>Eliminar Usuario</h1>
<a href="{% url 'usuarios:lista_usuarios' %}"><i class="bi bi-house-fill me-1"></i> Volver al listado</a>

<div class="alert alert-danger mt-3" style="max-width:500px;">
    <p>¿Estás segura de que deseas eliminar al usuario <strong>{{ usuario.username }}</strong>?</p>
    <p style="font-size:.88rem;">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'usuarios:lista_usuarios' %}" class="btn btn-secondary btn-sm me-2">
            Cancelar
        </a>
        <button type="submit" class="btn btn-danger btn-sm">
            <i class="bi bi-trash3-fill me-1"></i> Sí, eliminar
        </button>
    </form>
</div>
{% endblock %}
