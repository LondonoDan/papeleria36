{% extends "index.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/usuarios.css' %}">
<h1><i class="bi bi-person-plus-fill me-2"></i>Crear Usuario</h1>
<a href="{% url 'usuarios:lista_usuarios' %}">← Volver al listado</a>
<div class="formulario">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success mt-2">
            <i class="bi bi-check-circle me-1"></i> Crear Usuario
        </button>
    </form>
</div>
{% endblock %}
