    <!-- calendario -->
<div class="calendario">
  <div class="calendario-header">
    <button id="prev">◀</button>
    <span id="mes-anio"></span>
    <button id="next">▶</button>
  </div>
  <div class="calendario-grid" id="dias"></div>
</div>

<script>
  let fechaActual = new Date();

  function renderCalendario(fecha) {
    const diasContainer = document.getElementById("dias");
    const mesAnio = document.getElementById("mes-anio");
    diasContainer.innerHTML = "";

    const mes = fecha.getMonth();
    const anio = fecha.getFullYear();

    mesAnio.textContent = fecha.toLocaleString("es-ES", { month: "long", year: "numeric" });

    const primerDia = new Date(anio, mes, 1).getDay();
    const diasMes = new Date(anio, mes + 1, 0).getDate();

    // Espacios vacíos antes del primer día
    for (let i = 0; i < primerDia; i++) {
      const empty = document.createElement("div");
      empty.className = "dia empty";
      diasContainer.appendChild(empty);
    }

    // Días del mes
    for (let d = 1; d <= diasMes; d++) {
      const dia = document.createElement("div");
      dia.className = "dia";
      dia.textContent = d;

      // Ejemplo: marcar el día actual
      if (d === new Date().getDate() && mes === new Date().getMonth() && anio === new Date().getFullYear()) {
        dia.classList.add("hoy");
      }

      diasContainer.appendChild(dia);
    }
  }

  document.getElementById("prev").onclick = () => {
    fechaActual.setMonth(fechaActual.getMonth() - 1);
    renderCalendario(fechaActual);
  };

  document.getElementById("next").onclick = () => {
    fechaActual.setMonth(fechaActual.getMonth() + 1);
    renderCalendario(fechaActual);
  };

  renderCalendario(fechaActual);
</script>
<!-- termina el calendario-->
