  <!-- calendario -->
  <div class="calendario">
  <div class="calendario-header">
    <button id="prev">◀</button>
    <span id="mes-anio"></span>

  <!-- Empieza el calendario -->
  <div class="calendar-container">
    <button id="prev">◀</button>
    <div id="month-year"></div>

    <button id="next">▶</button>
  </div>
  <div class="calendario-grid" id="dias"></div>
</div>

<script>
  let fechaActual = new Date();

  function renderCalendario(fecha) {
    const diasContainer = document.getElementById("dias");
    const mesAnio = document.getElementById("mes-anio");
    diasContainer.innerHTML = "";

    const mes = fecha.getMonth();
    const anio = fecha.getFullYear();

    mesAnio.textContent = fecha.toLocaleString("es-ES", { month: "long", year: "numeric" });

    const primerDia = new Date(anio, mes, 1).getDay();
    const diasMes = new Date(anio, mes + 1, 0).getDate();

    // Espacios vacíos antes del primer día
    for (let i = 0; i < primerDia; i++) {
      const empty = document.createElement("div");
      empty.className = "dia empty";
      diasContainer.appendChild(empty);
    }

    // Días del mes
    for (let d = 1; d <= diasMes; d++) {
      const dia = document.createElement("div");
      dia.className = "dia";
      dia.textContent = d;

      // Ejemplo: marcar el día actual
      if (d === new Date().getDate() && mes === new Date().getMonth() && anio === new Date().getFullYear()) {
        dia.classList.add("hoy");
      }

      diasContainer.appendChild(dia);
    }
  }

  document.getElementById("prev").onclick = () => {
    fechaActual.setMonth(fechaActual.getMonth() - 1);
    renderCalendario(fechaActual);
  };

  document.getElementById("next").onclick = () => {
    fechaActual.setMonth(fechaActual.getMonth() + 1);
    renderCalendario(fechaActual);
  };

  renderCalendario(fechaActual);
</script>


  <div id="calendar"></div>

  <script>
    let currentDate = new Date();

    function renderCalendar(date) {
      const calendar = document.getElementById("calendar");
      const monthYear = document.getElementById("month-year");
      calendar.innerHTML = "";

      const year = date.getFullYear();
      const month = date.getMonth();

      monthYear.textContent = date.toLocaleString("es-ES", {
        month: "long",
        year: "numeric",
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Rellenar espacios antes del primer día
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
      }

      // Crear los días
      for (let d = 1; d <= daysInMonth; d++) {
        const day = document.createElement("div");
        day.className = "day";
        day.textContent = d;

        // Acción: marcar el día seleccionado
        day.onclick = () => {
          // quitar selección previa
          document
            .querySelectorAll(".day")
            .forEach((el) => el.classList.remove("selected"));
          // marcar el clicado
          day.classList.add("selected");
        };

        calendar.appendChild(day);
      }
    }

    document.getElementById("prev").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar(currentDate);
    };

    document.getElementById("next").onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar(currentDate);
    };

    renderCalendar(currentDate);
  </script>
